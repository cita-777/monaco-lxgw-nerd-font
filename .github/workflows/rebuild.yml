name: Rebuild Fonts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_sources.py

      - name: Build fonts
        run: python scripts/build.py

      - name: Validate fonts
        run: python scripts/validate.py

      - name: Package release zip
        run: python scripts/package.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonacoLXGWNerdFontMono
          path: dist/MonacoLXGWNerdFontMono.zip

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- fonts upstream.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rebuilt fonts
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts upstream.lock.json
          git commit -m "Rebuild font bundle from upstream releases"
          git push

      - name: Resolve release state
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(python scripts/release_version.py)"
          NAME="$(python scripts/release_version.py --name)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: ${{ steps.diff.outputs.changed == 'true' || steps.release.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          NAME="${{ steps.release.outputs.name }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" dist/MonacoLXGWNerdFontMono.zip --title "$NAME" --notes "Automated rebuild from upstream font releases."
